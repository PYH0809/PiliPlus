name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    # Every merge into main builds every platform and publishes them as a
    # release, which the app's update check reads. Android goes first: the
    # other jobs wait for it.
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            build_number:
                description: "Android: build number (versionCode), empty for the commit count. Raise it to install over a build from a longer branch"
                required: false
                default: ""
                type: string

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

# A newer merge replaces a push build still running; manual runs never cancel.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
    # A push build's release starts as a draft, which the app can't see, and
    # is published once the Android APKs are in it. If this job fails, the
    # builds still run; there is just no release.
    prepare:
        if: ${{ github.event_name == 'push' }}
        name: Draft release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            # release_note.py finds each commit's PR
            pull-requests: read
        outputs:
            tag: ${{ steps.draft.outputs.tag }}
        steps:
            - name: 代码迁出
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Write the release note
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  RELEASE_NOTE_MODEL: ${{ vars.RELEASE_NOTE_MODEL }}
              run: python3 -I lib/scripts/release_note.py "$RUNNER_TEMP/note.md"

            # The tag is the version name and the build number the APKs get.
            - name: Draft the release
              id: draft
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  version=$(grep -oP '^version:\s*\K[\d.]+' pubspec.yaml)
                  tag="$version+$(git rev-list --count HEAD)"
                  # Drafts that cancelled or failed push builds left: drafts made by
                  # this workflow's token only, so a draft prepared by hand stays.
                  gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]|select(.draft and .author.login == "github-actions[bot]").id' |
                    while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
                  gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/note.md"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

    android:
        needs: prepare
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event_name == 'push' || github.event.inputs.build_android == 'true') }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name != 'pull_request'
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  elif [ "${{ github.event_name }}" = "push" ]; then
                    # Without the key Gradle signs with the debug key, and that
                    # APK can't install over the release app.
                    echo "::error::SIGN_KEYSTORE_BASE64 is not set; a push build must be release-signed"
                    exit 1
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name != 'pull_request' }}
              shell: pwsh
              env:
                  BUILD_NUMBER: ${{ github.event.inputs.build_number }}
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name != 'pull_request' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            # Fails the build on an APK a phone would refuse, and logs each one's
            # hash and certificate digests (not its name) to compare a download to.
            # --min-sdk-version 21 checks the v1 (JAR) signature too: apksigner
            # skips it from 24 up, but vendor installers still read it.
            - name: Verify signature
              run: |
                  tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
                  for file in PiliPlus_android_*.apk; do
                    echo "::group::$file"
                    sha256sum "$file"
                    "$tools/zipalign" -c 4 "$file"
                    echo "zipalign: ok"
                    "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 21 "$file" | grep -v "DN:"
                    echo "::endgroup::"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: PiliPlus_android_*.apk

            - name: Upload to the draft release
              if: ${{ needs.prepare.outputs.tag != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: gh release upload "${{ needs.prepare.outputs.tag }}" PiliPlus_android_*.apk --clobber

            # android.json, which the app's update check reads, goes up after the
            # APKs, so its presence means they are all there; publish comes after.
            - name: Upload the update manifest
              if: ${{ needs.prepare.outputs.tag != '' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: pwsh lib/scripts/release_manifest.ps1 android "${{ needs.prepare.outputs.tag || github.event.inputs.tag }}" PiliPlus_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliPlus_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliPlus_android_*_x86_64.apk

    ios:
        needs: [prepare, android]
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event_name == 'push' || github.event.inputs.build_ios == 'true') }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
            draft_tag: ${{ needs.prepare.outputs.tag }}

    mac:
        needs: [prepare, android]
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.build_mac == 'true') }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
            draft_tag: ${{ needs.prepare.outputs.tag }}

    win_x64:
        needs: [prepare, android]
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event_name == 'push' || github.event.inputs.build_win_x64 == 'true') }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
            draft_tag: ${{ needs.prepare.outputs.tag }}

    linux_x64:
        needs: [prepare, android]
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.build_linux_x64 == 'true') }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
            draft_tag: ${{ needs.prepare.outputs.tag }}

    # Publishes the draft as soon as Android is in it; the other platforms
    # add their files to the published release as they finish, and one that
    # fails is left out rather than holding the release back.
    publish:
        needs: [prepare, android]
        if: ${{ !cancelled() && needs.prepare.outputs.tag != '' && needs.android.result == 'success' }}
        name: Publish release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
