name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
      # PiliPlus: a push build's draft release to upload into
      draft_tag:
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    # PiliPlus: two runs releasing the same tag take turns, so one can't
    # replace the packages under the ios.json the other just uploaded
    concurrency:
      group: release-${{ inputs.draft_tag || inputs.tag || github.run_id }}-ios
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus_ios_${{env.version}}.ipa Payload/Runner.app

      # PiliPlus: a rerun replaces the packages of a release that may already
      # have ios.json: withdraw it first, so it never points at packages
      # half replaced
      - name: Withdraw the update manifest
        if: ${{ inputs.draft_tag != '' || inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: pwsh lib/scripts/release_manifest.ps1 -Withdraw ios "${{ inputs.draft_tag || inputs.tag }}"

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_ios_*.ipa

      # PiliPlus: a push build adds its files to the draft release
      - name: Upload to the draft release
        if: ${{ inputs.draft_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.draft_tag }}" PiliPlus_ios_*.ipa --clobber

      # PiliPlus: ios.json, which the app's update check reads, goes up after
      # the packages, so its presence means they are all there
      - name: Upload the update manifest
        if: ${{ inputs.draft_tag != '' || inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: pwsh lib/scripts/release_manifest.ps1 ios "${{ inputs.draft_tag || inputs.tag }}" PiliPlus_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          name: iOS-release
          path: PiliPlus_ios_*.ipa
