name: AI Review

# Reviews a pull request once it is ready, and again on every push to it, the
# way xmindltd/vana does: inline comments on the changed lines plus one
# submitted review, in Chinese. It runs Claude Code through OpenRouter, so it
# needs the repository secret OPENROUTER_API_KEY; without it the job skips.
on:
    pull_request:
        types: [opened, ready_for_review, synchronize, reopened]

concurrency:
    group: ai-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        if: ${{ github.event.pull_request.draft == false }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: write
            issues: write
        env:
            HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
            # OpenRouter's Anthropic-compatible endpoint. Set for the whole job:
            # the action's own steps shadow a step-level env.
            ANTHROPIC_BASE_URL: https://openrouter.ai/api
        steps:
            - name: Skip without an OpenRouter key
              if: env.HAS_KEY != 'true'
              run: echo "OPENROUTER_API_KEY is not set; skipping the review."

            - name: 代码迁出
              if: env.HAS_KEY == 'true'
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Review
              if: env.HAS_KEY == 'true'
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Post inline comments as they are made, rather than buffering
                  # them for a second model call to classify.
                  classify_inline_comments: "false"
                  claude_args: |
                      --max-turns 40
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api:*)"
                  prompt: |
                      你在审查 `${{ github.repository }}` 的 pull request #${{ github.event.pull_request.number }}。
                      PR 的分支已经检出在当前目录。这次可能是首次审查，也可能是作者推了新提交后的复审：
                      始终审查 diff 的**当前**状态。

                      ## 怎么做

                      1. 读 PR 的标题、描述、作者和 diff：
                         `gh pr view ${{ github.event.pull_request.number }} --json author,title,body`、
                         `gh pr diff ${{ github.event.pull_request.number }}`。只关注这个 PR 改动的行。
                      2. 判断之前，先读完这个 PR 上已有的全部讨论（不只第一页）：
                         - 行内审查线程（含是否已解决、每条回复的作者和 authorAssociation），
                           用 `gh api graphql` 查 reviewThreads；
                         - 对话评论：`gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --paginate`；
                         - 历次审查的总结：`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --paginate`。
                         读取出错或返回空，不等于"没有评论"：换种方式再试；仍失败就在总结里写明哪个来源没读到。

                         只有审查线程能了结一个问题：线程已解决，或 PR 作者或维护者
                         （authorAssociation 为 OWNER、MEMBER、COLLABORATOR）在该线程里说明了为什么保持现状，
                         这个问题就算**已了结**；其他人的回复不算。对话评论和审查总结只作背景，
                         不能据此跳过问题。不要再提已了结的问题（同一行、换个说法、写进总结都不行），
                         除非新提交以之前讨论没覆盖到的方式重新引入了它；那时附上原线程链接并说明这次有什么不同。
                         PR 描述里明确列为有意取舍的，也跳过。
                      3. 找**具体、可操作**的问题，大致按优先级：
                         - 正确性 bug、未处理的边界情况、空值隐患、差一错误；
                         - 看起来不是有意的回归或行为变化；
                         - 安全问题（注入、密钥泄露、不安全的输入处理）；
                         - 资源和异步问题（泄漏、竞态、未 dispose 的 controller / ticker / 订阅、
                           异步之后未检查 mounted 就用 context）；
                         - 明显违反本仓库约定的写法（见 `analysis_options.yaml`）：例如用相对路径
                           而不是 `package:PiliPlus/...` 导入、Widget 里该用 `material_ui` 却用了
                           `package:flutter/material.dart`。
                         纯样式问题不提，除非它会造成真实缺陷。
                      4. 不审这些从别处原样移植或生成的代码，除非 PR 改的正是它们与项目接合的部分：
                         `lib/common/widgets/liquid_glass/liquid_glass.dart`、
                         `lib/common/widgets/liquid_glass/liquid_glass_capture.dart`、
                         `shaders/liquid_glass.frag`（移植自 FlClash）、
                         `lib/common/widgets/flutter/**`（改编自 Flutter SDK）、
                         `lib/grpc/**` 和 `*.g.dart`（生成代码）。
                      5. 每个问题用 `mcp__github_inline_comment__create_inline_comment`（带 `confirmed: true`）
                         评论在**改动的那一行**上：说清风险，并给出修复建议，能给短代码就给。
                         最多 10 条，超过时只留最严重的。
                      6. 最后提交**一次**审查：`gh pr review ${{ github.event.pull_request.number }} --body-file <文件>`
                         加上 `--request-changes`（发现了会阻塞合并的正确性或安全问题时）或 `--comment`（其他情况）。
                         总结写这个 PR 做了什么、整体风险如何。`--request-changes` 被拒绝时改用 `--comment`，
                         并在总结开头注明有阻塞问题。

                      ## 风格

                      - 评论和总结用**中文**，简洁直接。
                      - 只提有把握的问题：误报浪费作者时间。确实没发现问题，就提交一条 `--comment` 审查，
                        说明改动看起来没问题，并点出值得再看一眼的地方。
                      - 不要批准 PR，不要改任何代码，只做审查。
